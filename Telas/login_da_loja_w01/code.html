<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - AutoPeças</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-container": "#5dfd8a",
                      "surface-container-lowest": "#ffffff",
                      "surface-variant": "#e0e3e5",
                      "tertiary-fixed-dim": "#c8c6c6",
                      "secondary-fixed": "#66ff8e",
                      "surface-container-highest": "#e0e3e5",
                      "surface-container-high": "#e5e9eb",
                      "secondary": "#006d2f",
                      "primary-container": "#1b365d",
                      "surface-container-low": "#f1f4f6",
                      "surface": "#f7fafc",
                      "inverse-on-surface": "#eef1f3",
                      "on-primary": "#ffffff",
                      "on-primary-container": "#87a0cd",
                      "on-secondary-fixed-variant": "#005322",
                      "primary": "#002046",
                      "error": "#ba1a1a",
                      "primary-fixed-dim": "#aec7f7",
                      "on-error-container": "#93000a",
                      "inverse-primary": "#aec7f7",
                      "outline-variant": "#c4c6cf",
                      "on-secondary-container": "#007232",
                      "outline": "#74777f",
                      "surface-container": "#ebeef0",
                      "on-surface": "#181c1e",
                      "primary-fixed": "#d6e3ff",
                      "on-tertiary": "#ffffff",
                      "on-tertiary-container": "#a09f9e",
                      "on-secondary-fixed": "#002109",
                      "tertiary-container": "#363636",
                      "secondary-fixed-dim": "#3de273",
                      "inverse-surface": "#2d3133",
                      "background": "#f7fafc",
                      "surface-dim": "#d7dadc",
                      "on-tertiary-fixed-variant": "#474747",
                      "surface-tint": "#465f88",
                      "error-container": "#ffdad6",
                      "on-background": "#181c1e",
                      "on-secondary": "#ffffff",
                      "on-error": "#ffffff",
                      "on-primary-fixed-variant": "#2e476f",
                      "on-primary-fixed": "#001b3d",
                      "on-tertiary-fixed": "#1b1c1c",
                      "surface-bright": "#f7fafc",
                      "tertiary": "#212121",
                      "tertiary-fixed": "#e4e2e1",
                      "on-surface-variant": "#44474e"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "base": "8px",
                      "margin-desktop": "32px",
                      "gutter": "16px",
                      "margin-mobile": "16px",
                      "container-max": "1440px"
              },
              "fontFamily": {
                      "code-md": ["JetBrains Mono"],
                      "label-sm": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-sm": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-md": ["Inter"]
              },
              "fontSize": {
                      "code-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                      "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                      "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                      "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                      "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                      "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                      "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
              }
            }
          }
        }
    </script>
<style>
        /* Subtle grid background for the industrial aesthetic */
        .bg-industrial-grid {
            background-image: 
                linear-gradient(to right, rgba(196, 198, 207, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(196, 198, 207, 0.2) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        
        /* Material symbols base configuration */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface bg-industrial-grid min-h-screen flex flex-col justify-center items-center text-on-surface antialiased p-margin-mobile md:p-0">
<!-- Main Login Container -->
<main class="w-full max-w-[400px] flex flex-col items-center">
<!-- White Login Card -->
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded p-margin-desktop shadow-[0_4px_12px_rgba(0,32,70,0.05)] flex flex-col gap-margin-desktop">
<!-- Branding Header -->
<header class="flex flex-col items-center justify-center text-center">
<div class="w-12 h-12 bg-primary rounded flex items-center justify-center mb-gutter shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">precision_manufacturing</span>
</div>
<h1 class="font-headline-lg text-headline-lg font-black text-primary tracking-tighter uppercase">AutoPeças</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase mt-1 tracking-widest">[Nome da Loja]</p>
</header>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-gutter w-full" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">
                        E-mail de acesso
                    </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="email" name="email" placeholder="usuario@loja.com.br" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">
                            Senha
                        </label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors underline decoration-primary/30 underline-offset-2" href="#">
                            Esqueci minha senha
                        </a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface-container-lowest border border-outline-variant rounded font-code-md text-code-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors tracking-widest" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-2 bg-primary hover:bg-primary-container text-on-primary font-label-sm text-label-sm font-bold uppercase py-3 rounded border border-transparent focus:ring-2 focus:ring-offset-2 focus:ring-primary outline-none transition-colors flex items-center justify-center gap-2" type="submit">
                    Entrar
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Subtle Footer -->
<footer class="mt-gutter flex items-center justify-center gap-2 text-on-surface-variant opacity-80">
<span class="material-symbols-outlined text-[16px]">database</span>
<span class="font-label-sm text-label-sm uppercase tracking-wide">
                Catálogo consolidado · 100+ fontes
            </span>
</footer>
</main>
</body></html>
