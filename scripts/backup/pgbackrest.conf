# pgBackRest — ERP 2.0 (PITR)
# Instalar em /etc/pgbackrest/pgbackrest.conf no VPS-DB.
# O repositório fica na VPS-BACKUP (IP distinto), acessível via Tailscale (TLS/SSH).

[global]
# Repositório 1: VPS-BACKUP via SSH sobre Tailscale.
repo1-path=/var/lib/pgbackrest
repo1-host=vps-backup            # host/alias Tailscale da VPS de backup
repo1-host-user=pgbackrest
# Retenção: 4 fulls (~1 mês se full semanal). Ajuste conforme espaço.
repo1-retention-full=4
# Cifra do repositório (defesa extra além do disco cifrado). Guarde a passphrase
# fora do repo (secret): export PGBACKREST_REPO1_CIPHER_PASS no ambiente do cron.
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass vem por variável de ambiente, NUNCA em texto aqui.

# Compressão e paralelismo.
compress-type=zst
compress-level=6
process-max=4

# Observabilidade.
log-level-console=info
log-level-file=detail
start-fast=y
delta=y

[erp]
# Stanza da instância. pg1-path = data dir do Postgres no VPS-DB.
pg1-path=/var/lib/postgresql/16/main
pg1-port=5432
